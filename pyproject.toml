[project]
name = "backtesting-system"
version = "0.1.0"
description = "A lightweight student backtesting system."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "matplotlib>=3.8",
    "polars>=1.0",
    "pydantic>=2.0",
    "pyarrow>=15.0",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "tomli>=2.0; python_version < '3.11'",
    "yfinance>=0.2",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
polygon = ["polygon-api-client>=1.14"]
postgres = ["psycopg[binary]>=3.2"]
dev = [
    "httpx>=0.27",
    "pyright>=1.1.400",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["analytics", "data", "engine", "experiments", "paper", "pipeline", "research", "strategy", "visualization", "web"]
omit = ["pipeline/run_*.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "history_cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pyright]
include = ["analytics", "data", "engine", "experiments", "paper", "pipeline", "research", "strategy", "visualization", "web", "benchmarks"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
