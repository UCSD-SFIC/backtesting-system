[project]
name = "backtesting-system"
version = "0.1.0"
description = "A lightweight student backtesting system."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "polars>=1.0",
    "polygon-api-client>=1.14",
    "pyarrow>=15.0",
    "python-dotenv>=1.0",
    "yfinance>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
