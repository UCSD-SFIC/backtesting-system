name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci --prefix frontend

      - name: Test dashboard
        run: npm test --prefix frontend

      - name: Build dashboard
        run: npm run build --prefix frontend

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        # setup-uv creates and activates .venv when python-version is set.
        run: uv pip install -r requirements-dev.txt

      - name: Ruff
        run: .venv/bin/ruff check --output-format=github .

      - name: Pyright
        run: .venv/bin/pyright

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # setup-uv creates and activates .venv when python-version is set.
        run: uv pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: .venv/bin/python -m pytest --cov --cov-report=term --cov-fail-under=80

      - name: Benchmark smoke run
        if: matrix.python-version == '3.12'
        run: |
          .venv/bin/python -m benchmarks.bench_engine --output benchmark.json
          {
            echo '### Engine benchmark (100 tickers x 1260 days)'
            echo '```json'
            cat benchmark.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark result
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: benchmark.json
