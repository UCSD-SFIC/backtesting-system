# EMA dip sample: buy SPY when it closes below its 50-bar EMA while above its
# 200-bar EMA, otherwise stay in cash. Run with:
#   python -m pipeline.cli run --config configs/ema_dip.toml

tickers = ["SPY", "SH"]
timespan = "day"
start = 2025-01-01
end = 2025-12-06
benchmark = "SPY"

[strategy]
name = "ema_dip"

[strategy.params]
ema_window = 50
regime_window = 200

[data]
provider = "yfinance"
